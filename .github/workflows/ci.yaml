
name: eCabs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Maven Build, Docker Compose Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and run tests
        run: mvn -B -ntp clean verify
        
      - name: Check Docker Compose
        run: docker compose version

      - name: Build application Docker images
        run: docker compose -f compose.yaml build booking-producer booking-consumer
        
      
      - name: Create temporary CI secrets
        run: |
          mkdir -p secrets
          PASSWORD="$(openssl rand -hex 24)"

          printf 'default_user = booking_user\ndefault_pass = %s\n' \
            "$PASSWORD" > secrets/rabbitmq.conf

          printf 'spring.rabbitmq.password=%s\n' \
            "$PASSWORD" > secrets/producer.properties

          printf 'spring.rabbitmq.password=%s\nspring.datasource.password=%s\n' \
            "$PASSWORD" > secrets/consumer.properties

      - name: Start Docker Compose stack
        run: docker compose up -d --no-build

      - name: Wait for booking producer
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null --max-time 2 \
              http://127.0.0.1:8080/bookings; then
              echo "Producer is responding"
              exit 0
            fi
            sleep 2
          done
          echo "Producer did not become ready"
          exit 1

      - name: Test booking API
        run: |
          curl --fail-with-body -sS \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @ci/smoke-booking.json \
            http://127.0.0.1:8080/bookings

      - name: Show logs if pipeline fails
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Clean up containers
        if: always()
        run: docker compose down -v --remove-orphans
  
